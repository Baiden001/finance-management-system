# Local/CLI configuration template. Each company's project is configured separately in its own Supabase dashboard too;
# see docs/SETUP for settings that cannot be pushed from config (MFA, SMTP, password policy, backups/PITR).
project_id = "finance-management"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false                  # accountant accounts are created by an administrator only
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 10                  # per 5 minutes per IP
token_refresh = 150

[storage]
enabled = true
file_size_limit = "10MiB"
